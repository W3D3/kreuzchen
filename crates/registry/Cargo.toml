[package]
name = "kreuzchen-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
kreuzchen-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "sync", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["set-header"] }
base64 = "0.22"
serde_json = "1"
# GitHub sync: same HTTP stack as the app (rustls with ring, no aws-lc-rs build), and the tarball.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "kreuzchen-registry"
path = "src/main.rs"
