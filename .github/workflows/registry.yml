name: Registry image

# Builds the registry server image on every change to it and publishes it to
# GHCR for `registry-v*` tags. The image holds only the server, never definitions.
on:
  push:
    branches: [main]
    tags: ['registry-v*']
    paths:
      - 'crates/engine/**'
      - 'crates/registry/**'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/registry.yml'
  pull_request:
    paths:
      - 'crates/engine/**'
      - 'crates/registry/**'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/registry.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/w3d3/kreuzchen-registry
          tags: |
            type=match,pattern=registry-v(.*),group=1
            type=match,pattern=registry-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/registry-v') }}
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/registry-v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/registry/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/registry-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
