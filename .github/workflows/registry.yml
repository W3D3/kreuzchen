name: Registry image

# Builds the registry server image on every change to it and publishes it to
# GHCR for `registry-v*` tags. The image holds only the server, never definitions.
on:
  push:
    branches: [main]
    tags: ['registry-v*']
    paths:
      - 'crates/engine/**'
      - 'crates/registry/**'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/registry.yml'
  pull_request:
    paths:
      - 'crates/engine/**'
      - 'crates/registry/**'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/registry.yml'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A commit whose server tests fail must never ship as `latest`.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: '. -> target'
      - run: cargo test -p kreuzchen-engine -p kreuzchen-registry
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/w3d3/kreuzchen-registry
          tags: |
            type=match,pattern=registry-v(.*),group=1
            type=match,pattern=registry-v(\d+\.\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/registry-v') }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: startsWith(github.ref, 'refs/tags/registry-v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: crates/registry/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/registry-v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
