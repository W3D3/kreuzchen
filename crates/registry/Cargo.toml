[package]
name = "kreuzchen-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
kreuzchen-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros"] }
tower-http = { version = "0.6", features = ["set-header"] }
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
